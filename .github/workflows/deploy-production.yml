name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag to deploy
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: xsyu-sign-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hongchu server
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid image tag: $IMAGE_TAG" >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/xsyu-sign-deploy
          chmod 600 ~/.ssh/xsyu-sign-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull image and deploy with rollback
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/xsyu-sign-deploy \
            -p "$PROD_SSH_PORT" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "set -e; docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null; trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT; /opt/xsyu-sign/deploy.sh '$IMAGE_TAG'"

      - name: Verify public endpoint
        run: curl --fail --show-error --silent --retry 6 --retry-delay 5 --retry-all-errors https://xsyusign.hongchu.xyz/ >/dev/null
